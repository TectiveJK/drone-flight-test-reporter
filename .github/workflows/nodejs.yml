name: Linux Electron Build

on:
  push:
    branches:
      - master
      - feature/multi-flight-linux
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate renderer script syntax
        run: node -e "const fs = require('fs'); new Function(fs.readFileSync('renderer.js','utf8')); console.log('renderer.js syntax OK');"

      - name: Validate main script syntax
        run: node -e "const fs = require('fs'); new Function(fs.readFileSync('main.js','utf8')); console.log('main.js syntax OK');"

      - name: Build Linux packages
        run: npm run build:linux

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: drone-flight-test-reporter-linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: drone-flight-test-reporter-linux-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30
